[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "geohash-kit"
version = "0.1.0"
description = "Encode and decode geohashes, find neighbours, and cover a polygon with geohashes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyproj>=3.4", "shapely>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
geohash-kit = "geohash_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
